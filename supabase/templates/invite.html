<h2>You're invited to Project Violet</h2>

<p>An admin has set up a staff account for this email address.</p>

<p>
  <!-- token_hash + the /auth/confirm route, NOT the default
       ConfirmationURL: the app uses @supabase/ssr server-side auth, and
       this is the documented link shape for it — the route verifies the
       hash server-side (verifyOtp), sets the session cookies, and sends
       the new person on to set a password. The SAME template must be set
       in the production dashboard (Auth → Email Templates → Invite user);
       this file only configures local dev. -->
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite&next=/welcome"
    >Accept the invite and set your password</a
  >
</p>

<p>If you weren't expecting this, you can ignore it.</p>
